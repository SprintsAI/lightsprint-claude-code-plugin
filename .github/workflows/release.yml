name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile binaries (cross-compile all targets)
        run: |
          HASH=$(git rev-parse --short HEAD)
          VERSION=$(node -p "require('./package.json').version")
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          DEFINES="--define __BUILD_HASH__=\"\\\"$HASH\\\"\" --define __BUILD_VERSION__=\"\\\"$VERSION\\\"\" --define __BUILD_TIME__=\"\\\"$BUILD_TIME\\\"\""

          # macOS ARM64
          eval bun build scripts/lightsprint.js --compile --target=bun-darwin-arm64 --outfile lightsprint-darwin-arm64 $DEFINES
          sha256sum lightsprint-darwin-arm64 > lightsprint-darwin-arm64.sha256

          # macOS x64
          eval bun build scripts/lightsprint.js --compile --target=bun-darwin-x64 --outfile lightsprint-darwin-x64 $DEFINES
          sha256sum lightsprint-darwin-x64 > lightsprint-darwin-x64.sha256

          # Linux x64
          eval bun build scripts/lightsprint.js --compile --target=bun-linux-x64 --outfile lightsprint-linux-x64 $DEFINES
          sha256sum lightsprint-linux-x64 > lightsprint-linux-x64.sha256

          # Linux ARM64
          eval bun build scripts/lightsprint.js --compile --target=bun-linux-arm64 --outfile lightsprint-linux-arm64 $DEFINES
          sha256sum lightsprint-linux-arm64 > lightsprint-linux-arm64.sha256

          # Windows x64
          eval bun build scripts/lightsprint.js --compile --target=bun-windows-x64 --outfile lightsprint-win32-x64.exe $DEFINES
          sha256sum lightsprint-win32-x64.exe > lightsprint-win32-x64.exe.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: |
            lightsprint-*
            !*.ts

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
